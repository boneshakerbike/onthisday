<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#FC4C02"/>

  <!-- Strava-style chevron "S" mark (two chevron peaks) -->
  <!-- Left peak -->
  <polyline
    points="148,320 210,180 272,320"
    fill="none"
    stroke="white"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Right peak (offset, forms the S-like double chevron) -->
  <polyline
    points="240,320 302,180 364,320"
    fill="none"
    stroke="white"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
